<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Código de verificação — VitaPulse</title>
        <link rel="stylesheet" href="styles.css">
    </head>
<body>
    <div class="app">
        <div class="mobile auth-bg">
            <div class="status">
                <span>9:41</span>
                <span class="status-icons">▮▮ WiFi ▰</span>
            </div>
            <div class="auth-content">
                <button class="back" onclick="history.back()">←</button>
                <div class="code-area">
                    <h1 style="font-size:25px">Código de verificação</h1>
                    <p style="margin-top:45px">Entre o código de verificação que foi enviado para o<br>seu email</p>
                    <p style="color:#f05472">Placeholder@gmail.com</p><form data-form="verification">
                        <div class="code-inputs">
                            <input maxlength="1" inputmode="numeric" required>
                            <input maxlength="1" inputmode="numeric" required>
                            <input maxlength="1" inputmode="numeric" required>
                            <input maxlength="1" inputmode="numeric" required>
                        </div>
                        <button class="primary" type="submit" style="width:90%">Confirmar</button>
                    </form>
                    <button class="resend" onclick="toast('Novo código enviado')">Enviar um novo código</button>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js">

    </script>
</body>
</html>
