<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Entrar — VitaPulse</title>
        <link rel="stylesheet" href="styles.css">
    </head>
<body>
    <div class="app"><div class="mobile auth-bg">
        <div class="status"><span>9:41</span>
            <span class="status-icons">▮▮ WiFi ▰</span>
        </div>
        <div class="auth-content">
<h1 class="auth-title">Entrar</h1>
<p class="auth-sub">Bem-vindo(a) de volta!</p>
<form class="form" data-form="login">
<label class="field">✉<input type="email" required placeholder="Email"></label>
<label class="field">♙<input type="password" required placeholder="Senha">
    <button type="button" class="eye">◉</button>
</label>
<div style="text-align:center;margin:20px 0">
    <a href="forgot.html" style="color:#243951;font-weight:700">Esqueceu sua senha?</a>
</div>
<button
    class="primary"
    onclick="window.location.href='home.html'"
>
    Entrar
</button>
</form>
<div class="divider"><span class="ou">OU</span>
</div>
<button class="social" onclick="toast('Login social demonstrativo')">
    <img class="social-icon" src="assets/google-icon.png" alt="Google">
    Login com Gmail
</button>
<button class="social" onclick="toast('Login social demonstrativo')">
    <img class="social-icon" src="assets/samsung-icon.png" alt="Samsung Account">
    Login com Samsung Account
</button>
        <div class="bottom-link">Não possui uma conta? <a href="register.html">Cadastrar</a></div>
    </div>
</div>
</div>
    <script src="app.js">

    </script>
</body>
</html>
