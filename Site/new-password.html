<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Nova senha — VitaPulse</title>
        <link rel="stylesheet" href="styles.css">
    </head>
<body>
    <div class="app">
        <div class="mobile auth-bg">
            <div class="status">
                <span>9:41</span>
                <span class="status-icons">▮▮ WiFi ▰</span>
            </div>
            <div class="auth-content">
                <button class="back" onclick="history.back()">←</button>
                <h1 class="auth-title">Confirmar nova<br>senha</h1>
                <p class="forgot-copy" style="margin-bottom:45px">Insira a nova senha no campo abaixo e confirme</p>
                <form class="form" data-form="password">
                    <label class="field">♙<input type="password" required placeholder="Nova senha">
                        <button type="button" class="eye">◉</button>
                    </label>
                    <label class="field">♙<input type="password" required placeholder="Confirmar senha">
                        <button type="button" class="eye">◉</button>
                    </label>
                    <button class="primary" type="submit" style="margin-top:165px;width:100%">Confirmar nova senha</button>
                </form>
            </div>
        </div>
    </div>
    <script src="app.js">

    </script>
</body>
</html>
