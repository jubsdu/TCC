<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Motivo — VitaPulse</title>
        <link rel="stylesheet" href="styles.css">
    </head>
<body>
    <div class="app">
        <div class="mobile onboard">
            <div class="status">
                <span>9:41</span>
                <span class="status-icons">▮▮ WiFi ▰</span>
            </div>
<h1 style="margin-top:120px">Qual seu motivo para usar<br>nosso aplicativo?</h1>
<div class="choice-group">
    <button type="button" class="choice-btn" data-choice>
        Ansiedade
    </button>

    <button type="button" class="choice-btn" data-choice>
        Problema cardiovascular
    </button>

    <button type="button" class="choice-btn" data-choice>

    </button>

    <button type="button" class="choice-btn" data-choice>
        Outro
    </button>
</div>
<div class="onboard-spacer"></div>
<div class="dots">
    <i class="dot"></i>
    <i class="dot active"></i>
    <i class="dot"></i>
</div>
<div class="choice-message" id="choiceMessage">

</div>
<button class="primary-light" data-next="onboarding-treatment.html">
    Próximo
</button>
</div>
</div>
    <script src="app.js">

    </script>
