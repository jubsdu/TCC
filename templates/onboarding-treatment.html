<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Acompanhamento — VitaPulse</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    </head>
    <body>
        <div class="app">
            <div class="mobile onboard">
                <div class="status">
                    <span>9:41</span>
                    <span class="status-icons"> WiFi </span>
                </div>
                
                <h1 style="margin-top:120px">Você faz algum tratamento/<br>acompanhamento?</h1>
                
                <form action="{{ url_for('onboarding_treatment') }}" method="POST">
                    <div class="choice-group">
                        <button type="button" class="choice-btn" data-choice="psicoterapia">
                            Psicoterapia
                        </button>
                        <button type="button" class="choice-btn" data-choice="consulta">
                            Consulta médica
                        </button>
                        <button type="button" class="choice-btn" data-choice="medicacao">
                            Medicação prescrita
                        </button>
                        <button type="button" class="choice-btn" data-choice="nenhum">
                            Nenhum acompanhamento
                        </button>
                    </div>

                    <div class="onboard-spacer"></div>

                    <div class="dots">
                        <i class="dot"></i>
                        <i class="dot"></i>
                        <i class="dot active"></i>
                    </div>

                    <div class="choice-message" id="choiceMessage">
                        Selecione uma opção para continuar
                    </div>

                    <button type="submit" class="primary-light">
                        Próximo
                    </button>
                </form>
            </div>
        </div>
        <script src="{{ url_for('static', filename='app.js') }}"></script>
    </body>
</html>
