<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Motivo — VitaPulse</title>
    <!-- Referência de CSS para a pasta static -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css">
</head>
<body>
    <div class="app">
        <div class="mobile onboard">
            <div class="status">
                <span>9:41</span>
                <span class="status-icons"><i class="ri-wifi-line" style="color:#fff; font-size: 1.5em;"></i></span>
            </div>
            <h1 style="margin-top:120px">Qual seu motivo para usar<br>nosso aplicativo?</h1>
            <div class="choice-group">
                <button type="button" class="choice-btn" data-choice="ansiedade">
                    Ansiedade
                </button>
                <button type="button" class="choice-btn" data-choice="cardiovascular">
                    Problema cardiovascular
                </button>
                <button type="button" class="choice-btn" data-choice="pressao">
                    Pressão alta/baixa
                </button>
                <button type="button" class="choice-btn" data-choice="outro">
                    Outro
                </button>
            </div>
            <div class="onboard-spacer"></div>
            <div class="dots">
                <i class="dot"></i>
                <i class="dot active"></i>
                <i class="dot"></i>
            </div>
            <div class="choice-message" id="choiceMessage">
                Selecione uma opção para continuar
            </div>
            <!-- Rota ajustada para a função do Flask -->
            <button
                type="button"
                class="primary-light"
                id="reasonNextButton"
                data-next="{{ url_for('onboarding_treatment') }}"
            >
                Próximo
            </button>
        </div>
    </div>
    <!-- Referência de JS para a pasta static -->
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
