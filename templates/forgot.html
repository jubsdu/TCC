<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Esqueceu sua senha — VitaPulse</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css">
    </head>
    <body>
        <div class="app">
            <div class="mobile auth-bg">
                <div class="status">
                    <span>9:41</span>
                    <span class="status-icons">▮▮ WiFi ▰</span>
                </div>
                <div class="auth-content">
                    <button class="back" onclick="history.back()">←</button>
                    <h1 class="auth-title">Esqueceu sua<br>senha?</h1>
                    <p class="forgot-copy">Para recuperar sua senha, você precisa entrar com o seu email registrado. A partir disso, iremos enviar um código de recuperação neste email.</p>
                    <form class="form" data-form="forgot" action="{{ url_for('forgot') }}" method="POST">
                        <label class="field"><i class="ri-mail-fill"></i><input type="email" name="email" required placeholder="Email"></label>
                        <button class="primary" type="submit" style="margin-top:176px;width:100%">Enviar código</button>
                    </form>
                </div>
            </div>
        </div>
        <script src="{{ url_for('static', filename='app.js') }}"></script>
    </body>
</html>
