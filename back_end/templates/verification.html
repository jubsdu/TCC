<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Código de verificação — VitaPulse</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    </head>
    <body>
        <div class="app">
            <div class="mobile auth-bg">
                <div class="status">
                    <span>9:41</span>
                    <span class="status-icons">▮▮ WiFi ▰</span>
                </div>
                <div class="auth-content">
                    <button class="back" onclick="history.back()">←</button>
                    <div class="code-area">
                        <h1 style="font-size:25px">Código de verificação</h1>
                        <p style="margin-top:45px">Digite o código de 4 dígitos exibido no terminal do servidor</p>
                        <p style="color:#f05472">{{ email if email else 'Email da conta' }}</p>
                        {% if error %}<div class="error-message">{{ error }}</div>{% endif %}
                        {% with messages = get_flashed_messages() %}
                            {% for message in messages %}<div class="error-message">{{ message }}</div>{% endfor %}
                        {% endwith %}
                        <form data-form="verification" action="{{ url_for('verification') }}" method="POST">
                            <div class="code-inputs">
                                <input name="code_1" maxlength="1" inputmode="numeric" required>
                                <input name="code_2" maxlength="1" inputmode="numeric" required>
                                <input name="code_3" maxlength="1" inputmode="numeric" required>
                                <input name="code_4" maxlength="1" inputmode="numeric" required>
                            </div>
                            <button class="primary" type="submit" style="width:90%">Confirmar</button>
                        </form>
                        <button class="resend" onclick="toast('Novo código enviado')">Enviar um novo código</button>
                    </div>
                </div>
            </div>
        </div>
        <script src="{{ url_for('static', filename='app.js') }}"></script>
    </body>
</html>
