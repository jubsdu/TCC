<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>VitaPulse</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css">
    </head>
    <body>
        <div class="app">
            <div class="mobile onboard">
                <div class="status">
                    <span>9:41</span>
                    <span class="status-icons"><i class="ri-wifi-line" style="color:#fff; font-size: 1.5em;"></i></span>
                </div>
                <div class="logo-wrap">
                    <img
                        class="logo-image-full"
                        src="{{ url_for('static', filename='assets/vitapulse-logo-full.png') }}"
                        alt="VitaPulse — seu bem-estar, saúde em tempo real"
                    >
                </div>

                <h1>Bem vindo(a)!</h1>
                <p>Somos a VitaPulse, uma empresa que foca na sua saúde e bem estar cardíaco!
                    <br>Junte-se a nós e dê à sua saúde a atenção que ela merece!</p>

                <div class="onboard-spacer"></div>

                <div class="dots">
                    <i class="dot active"></i>
                    <i class="dot"></i>
                    <i class="dot"></i>
                </div>

                <button class="primary-light" data-next="{{ url_for('login') }}">
                    Próximo
                </button>
            </div>
        </div>
        <script src="{{ url_for('static', filename='app.js') }}"></script>
    </body>
</html>
